<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101828"><title>SRT Mobile</title><style>body{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#f4f6fb;color:#101828;margin:0;padding:24px 16px}.app{max-width:560px;margin:auto}h1{font-size:29px}p{color:#526075;line-height:1.5}.panel{background:white;padding:22px;border-radius:20px;box-shadow:0 5px 22px #15244b12}label{font-weight:650;display:block;margin:18px 0 8px}input,select,button,textarea{box-sizing:border-box;width:100%;font:inherit}input,select{border:1px solid #cdd5df;padding:14px;border-radius:12px;background:white}button{border:0;border-radius:12px;padding:15px;margin-top:18px;background:#2458d3;color:white;font-weight:700}button:disabled{opacity:.5}textarea{height:180px;padding:12px;border:1px solid #cdd5df;border-radius:12px}.hide{display:none}.error{color:#ad2020;white-space:pre-wrap}.small{font-size:13px}</style></head><body><main class="app"><h1>🎬 SRT Mobile</h1><p>Trích xuất lời thoại, tạo phụ đề có thời gian và dịch sang ngôn ngữ khác ngay trên iPhone.</p><div class="panel"><form id="form"><label for="file">1. Chọn video hoặc âm thanh</label><input id="file" type="file" name="file" accept="video/*,audio/*,.mp4,.mov,.m4v,.mp3,.m4a,.wav,.webm" required><label for="source">2. Ngôn ngữ gốc</label><select id="source" name="source"><option value="auto">Tự nhận diện</option><option value="zh">Tiếng Trung</option><option value="en">Tiếng Anh</option><option value="vi">Tiếng Việt</option><option value="pt">Tiếng Bồ Đào Nha</option><option value="ja">Tiếng Nhật</option><option value="ko">Tiếng Hàn</option><option value="es">Tiếng Tây Ban Nha</option></select><label for="target">3. Dịch sang</label><select id="target" name="target"><option value="pt">Tiếng Bồ Đào Nha</option><option value="en">Tiếng Anh</option><option value="vi">Tiếng Việt</option><option value="zh">Tiếng Trung</option><option value="es">Tiếng Tây Ban Nha</option><option value="ja">Tiếng Nhật</option><option value="ko">Tiếng Hàn</option><option value="fr">Tiếng Pháp</option><option value="de">Tiếng Đức</option><option value="th">Tiếng Thái</option><option value="id">Tiếng Indonesia</option></select><button id="go">Tạo phụ đề SRT</button></form><p id="status" role="status"></p><p id="error" class="error"></p><section id="results" class="hide"><h2>Đã tạo xong</h2><p id="count"></p><button id="original" type="button">Tải SRT gốc</button><button id="translated" type="button">Tải SRT đã dịch</button><label for="preview">Xem trước bản dịch</label><textarea id="preview" readonly></textarea></section><p class="small">Video được gửi đến máy chủ để xử lý. Không tải nội dung riêng tư lên máy chủ không tin cậy.</p></div></main><script>const form=document.getElementById('form'),go=document.getElementById('go'),status=document.getElementById('status'),error=document.getElementById('error'),results=document.getElementById('results');let data;function download(name,text){const blob=new Blob(['\ufeff'+text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}form.addEventListener('submit',async e=>{e.preventDefault();go.disabled=true;results.classList.add('hide');error.textContent='';status.textContent='Đang nhận diện và dịch lời thoại… Vui lòng giữ trang mở.';try{const r=await fetch('/api/process',{method:'POST',body:new FormData(form)});const body=await r.json();if(!r.ok)throw new Error(body.detail||'Không xử lý được video');data=body;document.getElementById('count').textContent=body.count+' đoạn phụ đề';document.getElementById('preview').value=body.translated;results.classList.remove('hide');status.textContent='Hoàn tất!'}catch(err){error.textContent=err.message;status.textContent=''}finally{go.disabled=false}});document.getElementById('original').onclick=()=>download('phu-de-goc.srt',data.original);document.getElementById('translated').onclick=()=>download('phu-de-'+data.target+'.srt',data.translated)</script></body></html>
